name: "Music API Test (temporary)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test ModelsLab music API
        env:
          MODELSLAB_API_KEY: ${{ secrets.MODELSLAB_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          pip install requests
          python3 scripts/test_music_api.py
      - name: Show vault files
        if: always()
        run: ls -la assets/music/ | tail -15
