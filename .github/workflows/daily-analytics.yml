name: "📊 Daily Performance & Trend Analytics"

on:
  schedule:
    # Every day at 04:00 UTC (09:00 PKT)
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📊 Pull YouTube Analytics & Analyze
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python -c "
          import json
          import sys
          sys.path.insert(0, 'src')
          from performance_learner import PerformanceLearner
          learner = PerformanceLearner()
          summary = learner.refresh_stats()
          print('📊 PERFORMANCE SUMMARY')
          print('=' * 50)
          print(f'Channel subs: {summary[\"channel_subs\"]}')
          print(f'Total views: {summary[\"total_views\"]}')
          print(f'Total videos: {summary[\"total_videos\"]}')
          print(f'Top themes: {summary[\"top_5_themes\"]}')
          print(f'Top poets: {summary[\"top_5_poets\"]}')
          print(f'Viral patterns: {summary[\"viral_patterns_count\"]}')
          "

      - name: 🔮 Refresh Trend Predictions
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from trend_predictor import TrendPredictor
          predictor = TrendPredictor()
          predictions = predictor.predict(n=10)
          print('\n🔮 TREND PREDICTIONS')
          print('=' * 50)
          for i, p in enumerate(predictions, 1):
              print(f'  {i}. {p[\"topic\"]} (score: {p[\"score\"]}, confidence: {p[\"confidence\"]})')
          "

      - name: 🏷️ Refresh Hashtag Trends
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from hashtag_optimizer import HashtagOptimizer
          opt = HashtagOptimizer()
          count = opt.refresh_trends()
          print(f'\n🏷️ Refreshed {count} hashtag trends')
          "

      - name: 💾 Commit analytics data
        run: |
          git config user.name "khateb-ishq-bot"
          git config user.email "bot@khateb-ishq.dev"
          git add data/ || true
          git diff --cached --quiet || git commit -m "chore: daily analytics update [skip ci]"
          git push || true
